<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Fantasy - GBA</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 640px;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'gba';                 // Loads the GBA core
    EJS_gameUrl = 'final.zip';        // 🌟 Fixed: Matches your exact filename "final.zip"
    EJS_startOnLoaded = true;

    // Routes the engine safely from the cloud to prevent black screens
    EJS_pathtodata = 'https://emulatorjs.org';         
  </script>
  
  <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
