<!DOCTYPE html>
<html lang="en">
<head>

  <title>Final Fantasy - GBA</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    EJS_player = '#game';
    EJS_core = 'gba';                 // Sets engine core to Game Boy Advance

    // 🚀 FIXED: Point to the cloud asset mirror to bypass your missing GBA core files
    EJS_pathtodata = 'https://emulatorjs.org';
  </script>
  
  <!-- 🚀 FIXED: Load the main player engine script framework from the stable cloud mirror -->
