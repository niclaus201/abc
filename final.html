<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Fantasy - GBA</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    EJS_player = '#game';
    EJS_core = 'gba';                 // 🌟 Changed: Sets engine to Game Boy Advance
    EJS_gameUrl = 'final.zip';        // 🌟 Changed: Matches your zipped Final Fantasy file name
    
    // 🚀 CRITICAL FIX: Pulls the GBA core from the cloud since your local data/ folder only has Sega cores
    EJS_pathtodata = 'https://emulatorjs.org';
  </script>
  
  <!-- 🚀 CRITICAL FIX: Loads the web player framework from the stable cloud mirror -->
  <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
