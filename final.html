<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Fantasy - GBA</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    // 1. Declare configuration variables before the loading script fires
    var EJS_player = '#game';
    var EJS_core = 'gba'; 
    var EJS_gameUrl = 'final.zip'; 
    var EJS_startOnLoaded = true;
    
    // 2. Streams the missing GBA runtime assets directly from the official CDN network
    var EJS_pathtodata = 'https://emulatorjs.org';
  </script>
  
  <!-- 3. Crucial: The script tag must be loaded at the very bottom after the variables are set -->
  <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
