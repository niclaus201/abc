<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Fantasy - GBA</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    EJS_player = '#game';
    EJS_core = 'gba';                 // Targets the mGBA player framework
    EJS_gameUrl = 'final.zip';        // References your physical game archive file
    EJS_startOnLoaded = true;

    // 🚀 THE CRITICAL FIX: Pull the GBA cores from the cloud to prevent local path 404 crashes!
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  </script>
  
  <!-- 🚀 FIXED: Load the player engine logic cleanly from the cloud mirror network -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
