<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>abc</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 640px;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    // 1. Define the viewport target container
    EJS_player = '#game';
    
    // 2. Set the target system runtime profile to GBA
    EJS_core = 'gba';                 

    // 3. Point directly to your active game file sitting in your root folder
    EJS_gameUrl = 'abc.zip';         

    // 4. Force player behaviors to initialize immediately upon loading completion
    EJS_startOnLoaded = true;

    // 5. Route asset requests to the cloud network to bypass local file errors
    EJS_pathtodata = 'https://emulatorjs.org';         
  </script>
  
  <!-- Loads the stable web player core script framework from the server mirror link -->
  <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
