<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GBA Emulator</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    // Set up the player container configuration
    EJS_player = '#game';
    EJS_core = 'gba';
    EJS_gameUrl = 'abc'; // 🌟 Loads your exact game file named "abc" sitting in the main folder

    // Forces assets to route through the stable cloud CDN network
    EJS_pathtodata = 'https://emulatorjs.org';
  </script>
  
  <!-- Loads the stable web player framework from the server mirror -->
  <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
