<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GBA Emulator Channel</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    // 1. Set up the display target container and core type
    EJS_player = '#game';
    EJS_core = 'gba'; // Keeps the core strictly on GBA to avoid errors!

    // 2. Read the browser URL parameters to figure out which game to load
    const urlParams = new URLSearchParams(window.location.search);
    const gameChoice = urlParams.get('game');

    // 3. The Multi-Game Router System
    if (gameChoice === 'toystory') {
        EJS_gameUrl = 'roms/Toy Story Racer.gba'; // Your converted Toy Story file
        
    } else if (gameChoice === 'finalfantasy') {
        EJS_gameUrl = 'final'; // 🌟 Matches your exact Final Fantasy file name!
        
    } else {
        // Default game if no custom parameter is added to the link
        EJS_gameUrl = 'abc1.zip'; // Your Mario game file name
    }

    // 4. Force core asset routing via the cloud CDN network 
    EJS_pathtodata = 'https://emulatorjs.org';
  </script>
  
  <!-- Loads the stable web player framework from the server mirror -->
  <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
