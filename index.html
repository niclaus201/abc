<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>abc</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 640px;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    // 1. Establish the viewport container selector
    EJS_player = '#game';
    
    // 2. Set the target emulation architecture profile to Game Boy Advance
    EJS_core = 'gba';                 

    // 3. CRITICAL: Point exactly to your root game file matching lowercase extensions
    EJS_gameUrl = 'abc.zip';         

    // 4. Force the execution environment to execute natively upon asset delivery
    EJS_startOnLoaded = true;

    // 5. Route critical core downloads safely from the stable public CDN
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';         
  </script>
  
  <!-- 6. CRITICAL: The loader script MUST be loaded at the very bottom, after our configuration variables -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
