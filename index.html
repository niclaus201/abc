<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Retro Arcade Channel</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #ffcc00;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      margin-bottom: 30px;
    }
    .menu-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .game-link {
      display: block;
      background-color: #1e1e1e;
      color: #ffffff;
      text-decoration: none;
      padding: 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid #333;
      transition: all 0.2s ease-in-out;
      text-align: center;
    }
    .game-link:hover {
      background-color: #2a2a2a;
      border-color: #ffcc00;
      transform: scale(1.02);
      box-shadow: 0 4px 15px rgba(255, 204, 0, 0.2);
    }
    .system-tag {
      font-size: 12px;
      color: #888;
      display: block;
      margin-top: 5px;
      font-weight: normal;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <h1>🎮 My Retro Arcade Menu</h1>

  <div class="menu-container">
    
    <a class="game-link" href="abc1.html">
      🍄 Super Mario
      <span class="system-tag">Game Boy Advance</span>
    </a>

    <a class="game-link" href="abc2.html">
      🕹️ GBA Game 2
      <span class="system-tag">Game Boy Advance</span>
    </a>

    <a class="game-link" href="toystory.html">
      🏎️ Toy Story Racer
      <span class="system-tag">Game Boy Advance (Converted)</span>
    </a>

    <a class="game-link" href="final.html">
      ⚔️ Final Fantasy
      <span class="system-tag">Game Boy Advance</span>
    </a>

    <a class="game-link" href="genesis.html">
      🌀 Sonic & Sega Classics
      <span class="system-tag">Sega Genesis</span>
    </a>

    <a class="game-link" href="metalslug5.html">
      💥 Metal Slug 5
      <span class="system-tag">Arcade (Neo Geo)</span>
    </a>

  </div>

</body>
</html>
