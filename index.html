<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GBA Arcade Channel</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      flex-direction: column; /* Places the menu bar safely above the game */
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #menu-bar {
      width: 100%;
      background-color: #111;
      padding: 12px 0;
      text-align: center;
      border-bottom: 2px solid #222;
      z-index: 100;
    }
    #menu-bar label {
      color: #fff;
      font-weight: bold;
      margin-right: 10px;
      font-size: 15px;
    }
    #game-selector {
      padding: 6px 14px;
      font-size: 14px;
      background-color: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      outline: none;
      transition: border-color 0.2s ease-in-out;
    }
    #game-selector:hover {
      border-color: #ffcc00;
    }
    #game-container {
      width: 100%;
      height: calc(100% - 50px); /* Subtracts the menu bar height to maintain perfect scale */
      max-width: 960px;
      max-height: 640px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- 1. The Interactive Dropdown Menu Bar Layout -->
  <div id="menu-bar">
    <label for="game-selector">Select Game:</label>
    <select id="game-selector">
      <option value="abc.zip">Main Game (abc)</option>
      <option value="abc1.zip">Game 1 (abc1)</option>
      <option value="abc2.zip">Game 2 (abc2)</option>
    </select>
  </div>

  <!-- 2. The Fullscreen Emulator Window Viewport Container -->
  <div id="game-container">
    <div id="game"></div>
  </div>

  <!-- 3. The Core Script Engine Context Setup Configuration -->
  <script>
    // Read the query parameters directly out of the active browser address bar
    const urlParams = new URLSearchParams(window.location.search);
    const initialGame = urlParams.get('game');
    const selector = document.getElementById('game-selector');

    // Keep the visible selection box matched perfectly to the running game track
    if (initialGame === 'abc1') selector.value = 'abc1.zip';
    else if (initialGame === 'abc2') selector.value = 'abc2.zip';
    else selector.value = 'abc.zip';

    // Map configuration targets into the dynamic loader engine global variables
    EJS_player = '#game';
    EJS_core = 'gba'; 
    EJS_gameUrl = selector.value; // Instantly serves whichever game file text string is current
    EJS_startOnLoaded = true;

    // Force system framework assets to stream down safely from the official cloud mirrors
    EJS_pathtodata = 'https://emulatorjs.org';

    // Listen for dropdown changes, clear browser history states, and launch cleanly
    selector.addEventListener('change', function() {
        let cleanName = this.value.replace('.zip', '');
        let targetUrl = window.location.origin + window.location.pathname + '?game=' + cleanName;
        
        // Force the browser tab to discard memory and boot the selected core completely fresh
        window.location.replace(targetUrl);
    });
  </script>
  
  <!-- Loads the stable web player core script framework from the server mirror link -->
  <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
