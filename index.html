<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>abc</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 640px;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'gba';                 // Loads the mGBA core [1]
    EJS_startOnLoaded = true;

    // 🌟 CHOOSE THE RIGHT OPTION FOR YOUR FILENAME BELOW:
    // Option A: If your file on GitHub is named "abc.zip" use this line:
    EJS_gameUrl = 'abc.zip';         
    
    // Option B: If your file on GitHub is just named "abc" with NO extension, uncomment this line:
    // EJS_gameUrl = 'abc';         

    // 🚀 FIXED: Pull the system engine cores from the official cloud CDN [1]
    EJS_pathtodata = 'https://emulatorjs.org';         
  </script>
  
  <!-- 🚀 FIXED: Load the main player library code script from the cloud mirror -->
  <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
