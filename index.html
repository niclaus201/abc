<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>abc</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 640px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_gameUrl = 'abc.gba';         // Links directly to your ROM file
    EJS_core = 'gba';                 // Loads the mGBA core
    EJS_pathtodata = 'data/';         // Points to the engine folder
    EJS_startOnLoaded = true;
  </script>
  <script src="data/loader.js"></script>

</body>
</html>
