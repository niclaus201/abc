<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-System Emulator Channel</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    // 1. Set up the display target container
    EJS_player = '#game';

    // 2. Read the browser URL parameters to figure out which game to load
    const urlParams = new URLSearchParams(window.location.search);
    const gameChoice = urlParams.get('game');

    // 3. The Multi-System Router Layout
    if (gameChoice === 'toystory') {
        EJS_core = 'gba';
        EJS_gameUrl = 'roms/Toy Story Racer.gba'; 
        
    } else if (gameChoice === 'finalfantasy') {
        EJS_core = 'gba';
        EJS_gameUrl = 'final'; 
        
    } else if (gameChoice === 'abc1') {
        EJS_core = 'gba';
        EJS_gameUrl = 'abc1.zip'; // Maps your Mario / GBA game file
        
    } else if (gameChoice === 'abc2') {
        EJS_core = 'gba';
        EJS_gameUrl = 'abc2.zip'; // Maps your second GBA game file
        
    } else if (gameChoice === 'genesis') {
        EJS_core = 'genesisPlusPlus'; // 🌀 Switches backend system to the Sega Genesis Core!
        EJS_gameUrl = 'genesis';      // Matches your exact Genesis file name
        
    } else if (gameChoice === 'metalslug') {
        EJS_core = 'fbneo'; 
        EJS_gameUrl = 'roms/mslug.zip'; 
        EJS_biosUrl = 'roms/neogeo.zip'; 
        
    } else if (gameChoice === 'metalslug5') {
        EJS_core = 'fbneo'; 
        EJS_gameUrl = 'roms/mslug5.zip'; 
        EJS_biosUrl = 'roms/neogeo.zip'; 
        
    } else if (gameChoice === 'metalslug6') {
        EJS_core = 'flycast'; 
        EJS_gameUrl = 'roms/mslug6.zip'; 
        EJS_biosUrl = 'roms/awbios.zip'; 
        
    } else {
        // Fallback default game if no parameter is passed via the link string
        EJS_core = 'gba';
        EJS_gameUrl = 'abc1.zip'; 
    }

    // 4. Force core asset routing via the cloud CDN network 
    EJS_pathtodata = 'https://emulatorjs.org';
  </script>
  
  <!-- Loads the stable web player framework from the server mirror -->
  <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
