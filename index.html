<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GBA & Arcade Emulator Channel</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    // 1. Set up the display target container
    EJS_player = '#game';

    // 2. Read the browser URL parameters to figure out which game to load
    const urlParams = new URLSearchParams(window.location.search);
    const gameChoice = urlParams.get('game');

    // 3. The Multi-Game Router System (No sub-folders, everything in root!)
    if (gameChoice === 'toystory') {
        EJS_core = 'gba';
        EJS_gameUrl = 'Toy Story Racer.gba'; // Located in the main folder
        
    } else if (gameChoice === 'finalfantasy') {
        EJS_core = 'gba';
        EJS_gameUrl = 'final'; // Matches your exact file name "final" in the main folder
        
    } else if (gameChoice === 'abc1') {
        EJS_core = 'gba';
        EJS_gameUrl = 'abc1.zip'; // Matches your Mario zip file in the main folder
        
    } else if (gameChoice === 'abc2') {
        EJS_core = 'gba';
        EJS_gameUrl = 'abc2.zip'; // Matches your second GBA file in the main folder
        
    } else if (gameChoice === 'genesis') {
        EJS_core = 'genesisPlusPlus';
        EJS_gameUrl = 'genesis'; // Matches your Genesis file in the main folder
        
    } else if (gameChoice === 'metalslug') {
        EJS_core = 'fbneo'; 
        EJS_gameUrl = 'mslug.zip'; // Arcade zip file in the main folder
        EJS_biosUrl = 'neogeo.zip'; // BIOS file in the main folder
        
    } else if (gameChoice === 'metalslug5') {
        EJS_core = 'fbneo'; 
        EJS_gameUrl = 'mslug5.zip'; // Arcade zip file in the main folder
        EJS_biosUrl = 'neogeo.zip'; // BIOS file in the main folder
        
    } else if (gameChoice === 'metalslug6') {
        EJS_core = 'flycast'; 
        EJS_gameUrl = 'mslug6.zip'; 
        EJS_biosUrl = 'awbios.zip'; 
        
    } else {
        // Default fallback game if no parameter is passed in the URL link string
        EJS_core = 'gba';
        EJS_gameUrl = 'abc1.zip'; 
    }

    // 4. Force core asset routing via the cloud CDN network 
    EJS_pathtodata = 'https://emulatorjs.org';
  </script>
  
  <!-- Loads the stable web player framework from the server mirror -->
  <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
