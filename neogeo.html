<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Geo Arcade</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #222;
            color: #fff;
            border: 2px solid #555;
            border-radius: 8px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #444;
            border-color: #888;
        }
        #game {
            width: 100%;
            height: 100%;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Game Selection Menu -->
    <div id="menu">
        <h2>Select a Neo Geo Game</h2>
        <button onclick="startGame('ssideki.zip')">Super Sidekicks</button>
        <button onclick="startGame('mslug5.zip')">Metal Slug 5</button>
    </div>

    <!-- Game Container -->
    <div id="game"></div>

    <script type="text/javascript">
        function startGame(romName) {
            // Hide menu, show game container
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game').style.display = 'block';

            // Configure EmulatorJS
            EJS_player = '#game';
            EJS_core = 'arcade';
            EJS_gameUrl = romName;
            EJS_biosUrl = 'neogeo.zip';
            EJS_pathtodata = 'data/';

            // Load script
            var script = document.createElement('script');
            script.src = 'data/loader.js';
            document.body.appendChild(script);
        }
    </script>

</body>
</html>
