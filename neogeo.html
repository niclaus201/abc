<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Sidekicks - 2 Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'arcade';
        EJS_gameUrl = 'ssideki.zip';
        EJS_biosUrl = 'neogeo.zip';
        EJS_pathtodata = 'data/';

        // Enable Netplay UI
        EJS_netplay = true;
        EJS_gameID = 'ssideki_room_1';

        // Public WebRTC Peer Server (Used for signaling only)
        EJS_netplayUrl = 'wss://peerjs.920404.xyz';

        EJS_buttons = {
            netplay: true
        };
    </script>
    <script src="data/loader.js"></script>

</body>
</html>
