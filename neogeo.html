<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Sidekicks - 2 Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'arcade';                     // Use generic Arcade core for NeoGeo BIOS compatibility
        EJS_gameUrl = 'ssideki.zip';              // Your Neo Geo ROM
        EJS_biosUrl = 'neogeo.zip';              // Neo Geo BIOS file
        EJS_pathtodata = 'data/';                // EmulatorJS assets directory

        // Netplay Configuration
        EJS_netplayUrl = 'wss://netplay.ejs.host'; 
        EJS_gameID = 'ssideki';

        // Force Netplay Button
        EJS_buttons = {
            netplay: true
        };
    </script>
    <script src="data/loader.js"></script>

</body>
</html>
